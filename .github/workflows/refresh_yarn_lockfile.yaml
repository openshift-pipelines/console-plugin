name: Refresh yarn lockfile

on:
  schedule:
    # Every Sunday at 03:00 UTC (8:30AM IST)
    - cron: "0 3 * * 0"

  workflow_dispatch:
    inputs:
      branch:
        description: Branch to refresh
        required: true
        type: string
        default: master
          
permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      branches: ${{ steps.set-matrix.outputs.branches }}

    steps:
      - name: Prepare branch matrix
        id: set-matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'branches=["${{ inputs.branch }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'branches=["master","main","release-v1.15.x","release-v1.20.x","release-v1.21.x","release-v1.22.x","release-v1.23.x","release-v1.24.x"]' >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install --global yarn@4.6.0

      - name: Verify Yarn version
        run: yarn --version

      - name: Remove yarn.lock
        run: rm -f yarn.lock

      - name: Install dependencies to regenerate yarn.lock
        run: yarn install --no-immutable

      - name: Create branch and commit changes
        shell: bash
        run: |
          SOURCE_BRANCH="${{ matrix.branch }}"
          BRANCH="automation/refresh-yarn-lockfile-${SOURCE_BRANCH}"

          git fetch origin "$BRANCH" || true

          git checkout -B "$BRANCH"

          git config user.name "openshift-pipelines-bot"
          git config user.email "pipelines-extcomm@redhat.com"

          git add yarn.lock

          if git diff --cached --quiet; then
            echo "No changes for ${SOURCE_BRANCH}"
            exit 0
          fi

          git commit -m "chore: regenerate yarn.lock"

          git push --force-with-lease origin "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          OPEN_PRS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [[ "$OPEN_PRS" -gt 0 ]]; then
            echo "An open PR already exists for ${BRANCH}"
            exit 0
          fi

            gh pr create \
              --base "${{ matrix.branch }}" \
              --head "$BRANCH" \
              --title "chore: regenerate yarn.lock - ${{ matrix.branch }}" \
              --body "This PR was created automatically from Refresh yarn lockfile Github Action.

          Changes:
          - Removed yarn.lock
          - Re-ran yarn install
          - Regenerated yarn.lock" \
                  --label "dependencies" \
                  --label "automated"
